name: wiisb-chat-local
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: wiisb
      POSTGRES_USER: wiisb
      POSTGRES_PASSWORD: local-development-only
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wiisb -d wiisb"]
      interval: 5s
      retries: 10
  api:
    build:
      context: ..
      dockerfile: infrastructure/Dockerfile
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      DATABASE_URL: postgres://wiisb:local-development-only@postgres:5432/wiisb
      JWT_SECRET: development-secret-replace-before-public-hosting-123456789
      LIVEKIT_URL: ws://127.0.0.1:7880
      LIVEKIT_INTERNAL_URL: http://livekit:7880
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: secret
    ports: ["127.0.0.1:4310:4310"]
    volumes: ["media:/data"]
    depends_on:
      postgres: { condition: service_healthy }
  livekit:
    image: livekit/livekit-server:v1.13.11
    command: ["--dev", "--bind", "0.0.0.0", "--node-ip", "127.0.0.1"]
    ports:
      ["127.0.0.1:7880:7880", "127.0.0.1:7881:7881", "127.0.0.1:7882:7882/udp"]
volumes:
  postgres:
  media:
