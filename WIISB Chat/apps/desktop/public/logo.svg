<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b1a62"/>
      <stop offset="1" stop-color="#0b0a1c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.26" cy="0.18" r="0.8">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="main" gradientUnits="userSpaceOnUse" x1="52" y1="44" x2="170" y2="196">
      <stop offset="0" stop-color="#ede9fe"/>
      <stop offset="0.45" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="reply" gradientUnits="userSpaceOnUse" x1="150" y1="136" x2="214" y2="228">
      <stop offset="0" stop-color="#fda4af"/>
      <stop offset="1" stop-color="#f43f5e"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="62" fill="url(#bg)"/>
  <rect x="8" y="8" width="240" height="240" rx="62" fill="url(#glow)"/>
  <rect x="11" y="11" width="234" height="234" rx="59" fill="none" stroke="#c4b5fd" stroke-opacity="0.28" stroke-width="3"/>
  <g transform="translate(0 -6)">
    <!-- the first message: a big bubble carrying the W -->
    <circle cx="112" cy="108" r="64" fill="url(#main)"/>
    <path d="M60 148 42 192 94 170Z" fill="url(#main)" stroke="url(#main)" stroke-width="10" stroke-linejoin="round"/>
    <path d="M80 86 97 132 112 100 127 132 144 86" fill="none" stroke="#1b1038" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- the reply: a smaller bubble that is typing -->
    <circle cx="178" cy="172" r="41" fill="#120b2b"/>
    <path d="M200 196 214 228 180 208Z" fill="#120b2b" stroke="#120b2b" stroke-width="10" stroke-linejoin="round"/>
    <circle cx="178" cy="172" r="34" fill="url(#reply)"/>
    <path d="M201 196 213 224 182 207Z" fill="url(#reply)" stroke="url(#reply)" stroke-width="6" stroke-linejoin="round"/>
    <circle cx="163" cy="172" r="6" fill="#fff"/>
    <circle cx="178" cy="172" r="6" fill="#fff"/>
    <circle cx="193" cy="172" r="6" fill="#fff"/>
  </g>
</svg>
